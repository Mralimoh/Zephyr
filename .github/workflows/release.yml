name: Release Zephyr 🌬️

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release All Platforms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build All Binaries
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME}
          PLATFORMS=("linux/amd64" "windows/amd64" "darwin/amd64" "darwin/arm64")

          for PLATFORM in "${PLATFORMS[@]}"; do
            OS=${PLATFORM%/*}
            ARCH=${PLATFORM#*/}
            
            echo "Building for $OS/$ARCH..."
            
            FOLDER_NAME="zephyr-${VERSION}-${OS}-${ARCH}"
            mkdir -p $FOLDER_NAME
            
            SUFFIX=""
            if [ "$OS" == "windows" ]; then
              SUFFIX=".exe"
            fi
            
            CGO_ENABLED=0 GOOS=$OS GOARCH=$ARCH go build -ldflags="-s -w" -o $FOLDER_NAME/zephyr-client$SUFFIX ./cmd/client
            CGO_ENABLED=0 GOOS=$OS GOARCH=$ARCH go build -ldflags="-s -w" -o $FOLDER_NAME/zephyr-server$SUFFIX ./cmd/server
            
            [ -f client_config.json.example ] && cp client_config.json.example $FOLDER_NAME/
            [ -f server_config.json.example ] && cp server_config.json.example $FOLDER_NAME/
            [ -f README.md ] && cp README.md $FOLDER_NAME/
            [ -f credentials.json ] && cp credentials.json $FOLDER_NAME/
            
            zip -r "${FOLDER_NAME}.zip" $FOLDER_NAME
            rm -rf $FOLDER_NAME
          done

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: zephyr-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}